<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="splat" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- dashed mask boundary -->
  <circle cx="32" cy="33" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="3 3.5"/>

  <!-- gaussian splat cluster -->
  <circle cx="24" cy="26" r="10.5" fill="url(#splat)"/>
  <circle cx="39" cy="24" r="8" fill="url(#splat)" opacity="0.9"/>
  <circle cx="33" cy="40" r="9" fill="url(#splat)" opacity="0.85"/>
  <circle cx="20" cy="41" r="6" fill="url(#splat)" opacity="0.75"/>
</svg>
